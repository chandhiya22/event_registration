name: Build and Push Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v2
        with:
          registry: crconfer7885.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push processing-service
        run: |
          docker build -t crconfer7885.azurecr.io/processing-service:latest ./processing-service
          docker push crconfer7885.azurecr.io/processing-service:latest

      - name: Build & Push registration-api
        run: |
          docker build -t crconfer7885.azurecr.io/registration-api:latest ./registration-api
          docker push crconfer7885.azurecr.io/registration-api:latest

      - name: Build & Push admin-dashboard-service
        run: |
          docker build -t crconfer7885.azurecr.io/admin-dashboard-service:latest ./admin-dashboard-service
          docker push crconfer7885.azurecr.io/admin-dashboard-service:latest